<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Correção - Mr. Léo</title>
<style>
:root {
  --bg:#f4f6fb; --card:#fff; --text:#1f2430; --muted:#6b7280; --border:#e2e5ec;
  --accent:#2f5496; --accent-text:#fff; --chip:#eef1f8; --green:#d9ead3; --green-text:#2e5c1a; --danger:#c0392b;
  --shadow:0 1px 3px rgba(20,24,40,.08),0 1px 2px rgba(20,24,40,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#14161c; --card:#1d2028; --text:#eef0f5; --muted:#9aa0ad; --border:#30333d;
    --accent:#5b82c4; --accent-text:#0d1117; --chip:#262a33; --green:#23361f; --green-text:#b7e2a4; --danger:#e57368;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg:#14161c; --card:#1d2028; --text:#eef0f5; --muted:#9aa0ad; --border:#30333d;
  --accent:#5b82c4; --accent-text:#0d1117; --chip:#262a33; --green:#23361f; --green-text:#b7e2a4; --danger:#e57368;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
header.topo { text-align:center; padding:14px 12px; background:var(--card); border-bottom:1px solid var(--border); }
header.topo h1 { margin:0; font-size:1.35rem; font-weight:800; color:var(--accent); }
.app-shell { display:flex; align-items:stretch; min-height:calc(100dvh - 60px); }
aside.sidebar { flex:0 0 auto; width:108px; padding:12px 8px; background:var(--card); border-right:1px solid var(--border);
  position:sticky; top:0; height:100dvh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
aside.sidebar .titulo { font-size:.7rem; font-weight:700; color:var(--muted); text-align:center; margin-bottom:4px; }
#tabs { display:flex; flex-direction:column; gap:8px; }
.tab { width:100%; padding:10px 6px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.8rem; font-weight:600; cursor:pointer; }
.tab.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
main { flex:1; min-width:0; padding:12px; display:grid; grid-template-columns:1fr; gap:12px; align-content:start; }
@media (min-width:640px) { main { grid-template-columns:1fr 1fr; } }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:10px 12px; }
.card h2 { font-size:.82rem; margin:0 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.subtabs { display:flex; gap:6px; margin:0 0 6px; }
.subtabs.hidden { display:none; }
.subtab { flex:1; padding:7px 6px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.82rem; font-weight:700; cursor:pointer; }
.subtab.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
.row { display:flex; align-items:center; gap:8px; padding:5px 4px; border-radius:8px; font-size:.88rem; }
.row + .row { border-top:1px solid var(--border); }
.row input[type="checkbox"] { width:18px; height:18px; flex:0 0 auto; accent-color:var(--accent); }
.row .nome { font-weight:600; flex:1; }
.row .turma { font-size:.7rem; color:var(--muted); background:var(--chip); padding:1px 7px; border-radius:999px; }
.add-aluno { display:flex; gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
.add-aluno input[type="text"], .add-aluno select { padding:7px 9px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.85rem; }
.add-aluno input[type="text"] { flex:1; min-width:0; }
.add-aluno button { padding:7px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-text); font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap; }
.msg-erro { margin-top:6px; font-size:.8rem; font-weight:600; color:var(--danger); }
.msg-erro.hidden { display:none; }
.fila-row.corrigido { background:var(--green); border-radius:10px; }
.fila-row.corrigido .nome, .fila-row.corrigido .pos, .fila-row.corrigido .carinha { text-decoration:line-through; color:var(--green-text); }
.pos { font-weight:700; min-width:28px; color:var(--muted); }
:root { --avatar:5.4rem; }
.carinha { font-size:var(--avatar); line-height:1; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
.carinha img { width:var(--avatar); height:var(--avatar); object-fit:cover; border-radius:50%; display:block; }
.setas { display:flex; flex-direction:column; flex:0 0 auto; margin:0 2px; }
.seta { background:none; border:none; padding:0 3px; height:13px; width:22px; line-height:0; color:var(--muted); opacity:.4; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.seta:hover, .seta:active { opacity:1; }
.seta.vazia { visibility:hidden; pointer-events:none; }
.seta svg { display:block; }
.row.com-temas { flex-wrap:wrap; row-gap:4px; }
.row.com-temas .turma { display:none; }
.row.com-temas .nome { flex:1 1 0; min-width:92px; overflow-wrap:break-word; }
.btn-genero { background:none; border:1px solid var(--border); border-radius:6px; padding:1px 5px; font-size:1rem; line-height:1.3; cursor:pointer; flex:0 0 auto; }
.btn-genero:hover { background:var(--chip); }
.btn-olho { background:none; border:none; color:var(--muted); cursor:pointer; padding:0 4px; margin-left:4px; vertical-align:middle; line-height:1; opacity:.7; }
.btn-olho:hover { opacity:1; }
.btn-olho svg { display:block; }
.row select.tema { max-width:84px; padding:2px 4px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.7rem; }
.limpar-wrap { margin-top:14px; text-align:right; }
button.limpar { background:none; border:1px solid var(--danger); color:var(--danger); padding:8px 14px; border-radius:10px; font-size:.85rem; font-weight:600; cursor:pointer; }
.modal-overlay { position:fixed; inset:0; background:rgba(10,12,18,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal-overlay.hidden { display:none; }
.modal { background:var(--card); color:var(--text); border-radius:14px; padding:20px; max-width:340px; width:100%; box-shadow:var(--shadow); }
.modal p { margin:0 0 18px; font-size:.95rem; }
.modal .actions { display:flex; gap:10px; justify-content:flex-end; }
.modal button { padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--chip); color:var(--text); font-weight:600; cursor:pointer; }
.modal button.confirmar { background:var(--danger); border-color:var(--danger); color:#fff; }
  
html { max-width:100%; overflow-x:hidden; }
main > .card { min-width:0; }
.row .nome { min-width:0; overflow-wrap:anywhere; }
.add-aluno { flex-wrap:wrap; }
.add-aluno input[type="text"] { flex:1 1 140px; min-width:0; }
.add-aluno select { flex:0 0 auto; }
header.topo h1 { font-size:clamp(1.05rem, 5vw, 1.35rem); overflow-wrap:anywhere; }
@media (max-width:480px) {
  aside.sidebar { width:84px; padding:10px 6px; }
  .tab { padding:9px 4px; font-size:.72rem; }
  main { padding:8px; gap:8px; }
  .card { padding:8px 10px; }
  .add-aluno input[type="text"] { flex:1 1 100%; }
  .modal { max-width:100%; }
}

.sep-corrigidos { margin-top:10px; padding:6px 4px 4px; border-top:2px solid var(--border); font-size:.75rem; font-weight:800; letter-spacing:.06em; color:var(--green-text); text-align:center; }
.fila-dividida { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.fila-col { min-width:0; container-type:inline-size; }
.fila-col + .fila-col { border-left:1px solid var(--border); padding-left:10px; }
.fila-col h3 { margin:0 0 4px; padding-bottom:4px; font-size:.75rem; text-align:center; color:var(--accent); border-bottom:2px solid var(--border); text-transform:uppercase; letter-spacing:.04em; }
.fila-dividida .row { gap:5px; padding:5px 2px; font-size:.8rem; }
.fila-dividida .pos { min-width:22px; }
.fila-dividida .carinha { font-size:var(--avatar); }
.fila-vazia { font-size:.75rem; color:var(--muted); text-align:center; padding:8px 0; }
  body.bloqueado header.topo, body.bloqueado .app-shell { display:none; }
#gate { display:none; min-height:100dvh; align-items:center; justify-content:center; padding:20px; }
body.bloqueado #gate { display:flex; }
#gate form { background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:22px; width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px; text-align:center; }
#gate h2 { margin:0 0 4px; font-size:1.1rem; color:var(--accent); }
#gate input { padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:1rem; text-align:center; }
#gate button { padding:10px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-text); font-weight:700; font-size:.95rem; cursor:pointer; }
#gate .erro { color:var(--danger); font-size:.85rem; font-weight:600; }
#gate .erro.hidden { display:none; }
.fila-dividida .row .nome { overflow-wrap:break-word; }
.carinha.clicavel { cursor:pointer; -webkit-tap-highlight-color:transparent; }
.carinha.girando { border-radius:50%; background:var(--chip); width:var(--avatar); height:var(--avatar); overflow:hidden; color:var(--accent); }
.carinha.girando svg { width:100%; height:100%; animation:giro-espiral .7s linear infinite; }
@keyframes giro-espiral { to { transform:rotate(360deg); } }
.fila-row { font-size:1.32rem; padding-top:10px; padding-bottom:10px; }
.fila-dividida .fila-row { font-size:1.2rem; padding-top:10px; padding-bottom:10px; }
/* Coluna estreita (celular): avatar em cima, nome embaixo */
@container (max-width:250px) {
  .fila-dividida .fila-row { --avatar:min(5.4rem,80cqw); font-size:min(1.2rem,15cqw); }
  .fila-dividida .fila-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"pos setas chk" "carinha carinha carinha" "nome nome nome"; align-items:center; column-gap:4px; row-gap:2px; padding:4px 2px; min-width:0; }
  .fila-dividida .fila-row .pos { grid-area:pos; justify-self:start; min-width:0; }
  .fila-dividida .fila-row .setas { grid-area:setas; justify-self:center; margin:0; }
  .fila-dividida .fila-row > input[type="checkbox"] { grid-area:chk; justify-self:end; }
  .fila-dividida .fila-row .carinha { grid-area:carinha; justify-self:center; }
  .fila-dividida .fila-row .nome { grid-area:nome; text-align:center; }
}
</style>
</head>
<body class="bloqueado">
<div id="gate">
  <form id="gate-form">
    <h2>🔒 Lista de Correção</h2>
    <input type="password" id="gate-senha" placeholder="Senha" autocomplete="current-password">
    <button type="submit" id="gate-btn">Entrar</button>
    <div id="gate-erro" class="erro hidden" role="alert">Senha incorreta</div>
  </form>
</div><header class="topo"><h1>Lista de Correção - Mr. Léo</h1></header>
<div class="app-shell">
  <aside class="sidebar">
        <div id="tabs"></div>
  </aside>
  <main>
    <section class="card">
      <h2>Alunos<button type="button" id="btn-olho" class="btn-olho" title="Mostrar/ocultar tema dos alunos" aria-label="Mostrar ou ocultar tema dos alunos"></button></h2>
      <div id="subtabs" class="subtabs hidden"></div>
      <div id="lista-alunos"></div>
      <div class="add-aluno">
        <input type="text" id="novo-aluno-nome" placeholder="Nome do aluno">
        <select id="novo-aluno-turma">
          <option value="">Turma</option>
          <option value="4º">4º</option>
          <option value="5º">5º</option>
        </select>
        <select id="novo-aluno-tema" title="Tema do avatar"></select>
        <button id="btn-add-aluno">+ Adicionar</button>
      </div>
      <div id="msg-aluno" class="msg-erro hidden" role="alert"></div>
    </section>
    <section class="card">
      <h2>Fila de Correção</h2>
      <div id="lista-fila"></div>
      <div class="limpar-wrap"><button class="limpar" id="btn-limpar">Limpar Fila</button></div>
    </section>
  </main>
</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <p>Tem certeza que deseja limpar toda a fila? Essa ação não pode ser desfeita.</p>
    <div class="actions">
      <button id="modal-cancelar">Cancelar</button>
      <button class="confirmar" id="modal-confirmar">Limpar</button>
    </div>
  </div>
</div>

let temasAlunos = {};

// ===== GÊNERO DOS AVATARES =====
// Avatares marcados "f" só saem para meninas e "m" só para meninos; sem marcação = neutro (qualquer um).
// Se o gênero do aluno for desconhecido, só saem avatares neutros.
// Para marcar uma imagem específica use "Tema/indice" (ex.: "Futebol/0": "m"); para o tema inteiro, o nome do tema.
const AVATAR_GENERO = { "🦄": "f", "🌸": "f", "🎀": "f" };
const IMG_GENERO = { "Ginástica rítmica": "f" };
function generoDoAvatar(ref) {
  if (ref && ref.charAt(0) === "@") {
    const chave = ref.slice(1);
    return IMG_GENERO[chave] || IMG_GENERO[chave.split("/")[0]] || "";
  }
  return AVATAR_GENERO[ref] || "";
}
const poolBrutoDoTema = tema => {
  const t = THEMES[tema] || THEMES["Geral"];
  return t.emojis.concat(t.imagens.map((_, i) => "@" + tema + "/" + i));
};
const poolDoTema = (tema, genero) => {
  const ok = ref => { const g = generoDoAvatar(ref); return !g || g === genero; };
  let refs = poolBrutoDoTema(tema).filter(ok);
  if (!refs.length) refs = poolBrutoDoTema("Geral").filter(ok); // tema sem opção adequada: usa o Geral
  return refs.length ? refs : CARINHAS;
};

const semAcento = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
const NOMES_F = new Set(("AGATHA ALICE ALINE AMANDA ANA ANDREA ANGELA ANTONELLA BARBARA BEATRIZ BIANCA BRUNA CAMILA CAMILLE CAROLINA CATARINA CECILIA CLARA CLARICE DANIELA DEBORA DIANA EDUARDA ELISA ELOA EMANUELA EMANUELLE EMILY ESTER EVA FERNANDA FLAVIA GABRIELA GIOVANNA GISELE HELENA HELOISA INGRID ISA ISABEL ISABELA ISABELE ISABELLA ISABELLE ISADORA IRIS JOANA JULIA JULIANA JULIETA KAROLINE LARA LARISSA LAURA LAVINIA LETICIA LIA LILIAN LIVIA LORENA LUANA LUCIANA LUIZA LUISA LUNA LYVIA MAITE MANUELA MARCELA MARGARIDA MARIA MARIANA MARIANE MARINA MARTA MELISSA MIRELLA MIRELA NATALIA NICOLE OLIVIA PAULA PIETRA RAFAELA REBECA RENATA SABRINA SARA SOFIA SOPHIA SOPHIE STELLA TAINA THAIS VALENTINA VANESSA VERA VITORIA YASMIN YARA").split(" "));
const NOMES_M = new Set(("ADRIANO ALAN ALEXANDRE ANDRE ANTONIO ARTHUR ARTUR BENICIO BENJAMIN BENTO BERNARDO BRENO BRUNO CAIO CALEBE CARLOS DANIEL DAVI DAVID DIEGO DIOGO EDUARDO ENRICO ENZO ERICK FABIO FELIPE FERNANDO FILIPE FRANCISCO GABRIEL GAEL GUILHERME GUSTAVO HEITOR HENRIQUE HUGO IGOR ISAAC JOAO JOSE JOSUE KAIQUE LEANDRO LEONARDO LORENZO LUAN LUCA LUCAS LUIS LUIZ MARCELO MARCOS MATEUS MATHEUS MAURICIO MIGUEL MURILO NATAN NICOLAS NICOLAU NOAH OTHO OTTO OTAVIO PAULO PEDRO RAFAEL RENAN RICARDO ROBERTO RODRIGO SAMUEL SERGIO THEO THIAGO TIAGO VICENTE VICTOR VINICIUS VITOR WILLIAM YURI").split(" "));
function generoInferido(nome) {
  const p = semAcento(nome).split(/\s+/)[0] || "";
  if (NOMES_F.has(p)) return "f";
  if (NOMES_M.has(p)) return "m";
  if (/[A-Z]{3,}A$/.test(p)) return "f";   // termina em A (ex.: Valentina) — nomes fora da lista
  if (/[A-Z]{3,}O$/.test(p)) return "m";   // termina em O (ex.: Bruno)
  return "";                                // desconhecido: só avatares neutros
}
let generosAlunos = {}; // correções manuais: { NOME: "f" | "m" }
const generoDoNome = nome => generosAlunos[nome] || generoInferido(nome);
// Avatar guardado na fila: emoji literal, ou "@Tema/indice" para imagem
function montarAvatar(ref, el) {
  el.textContent = "";
  if (ref && ref.charAt(0) === "@") {
    const [tema, idx] = ref.slice(1).split("/");
    const src = THEMES[tema] && THEMES[tema].imagens[Number(idx)];
    if (src) { const img = document.createElement("img"); img.src = src; img.alt = ""; el.appendChild(img); }
  } else el.textContent = ref || "";
}
const mk = (lista, t) => lista.map(n => ({ nome: n, turma: t }));
const DIAS = {
  "SEGUNDA": { label: "SEGUNDA", alunos: mk(["BENTO","BERNARDO","BRUNA","DANIELA","ISABELLE","MARINA","MIGUEL BAUTE","VALENTINA FF","VALENTINA SS"], "4º") },
  "TERÇA": { label: "TERÇA", alunos: mk(["AMANDA","BÁRBARA","BENÍCIO","EVA","JÚLIA","LAURA","LUCAS KALUME","MARIANA","MELISSA","MIGUEL CADIMA","NICOLAS","OLÍVIA","OTHO"], "5º") },
  "QUARTA": { label: "QUARTA", alunos: mk(["BENTO","BERNARDO","BRUNA","DANIELA","FELIPE","ISABELLE","MARINA","MIGUEL LOPES","VALENTINA SS"], "4º") },
  "QUINTA": { label: "QUINTA", alunos: mk(["ANDRÉ","BENTO","LUCAS DE PINA","BERNARDO","MIGUEL LOPES","FELIPE","BRUNA","DANIELA","ISABELLE","VALENTINA SS","VALENTINA FF","CECÍLIA","MARIA JÚLIA","LUNA"], "4º")
    .concat(mk(["BENÍCIO","LUCAS KALUME","NICOLAS","EVA","HEITOR","JÚLIA","MIGUEL CADIMA"], "5º")) }
};
const ORDEM_DIAS = Object.keys(DIAS);
const ORDEM_TURMAS = ["4º", "5º", ""];
  // Alunas que fazem a correção com a Tia Vivi (fila separada), por dia
const VIVI = {
  "QUINTA": new Set(["BRUNA","CECÍLIA","DANIELA","ISABELLE","LUNA","MARIA JÚLIA","VALENTINA FF","VALENTINA SS"])
};
const ehVivi = (dia, nome) => !!(VIVI[dia] && VIVI[dia].has(nome));

let diaAtual = ORDEM_DIAS[0];
let filas = {}, extras = {}, turmaAtual = {};
ORDEM_DIAS.forEach(d => { filas[d] = []; extras[d] = []; turmaAtual[d] = null; });
let db = null;
const writeChainFila = {}, writeChainExtras = {};

function salvarGeneros() {
  try { localStorage.setItem("generos_alunos", JSON.stringify(generosAlunos)); } catch (e) {}
  if (!db) return;
  writeChainGeneros = writeChainGeneros.then(() => db.doc("config/generos").set({ map: generosAlunos }))
    .catch(err => console.error("Erro ao salvar gêneros:", err));
}
let writeChainGeneros = Promise.resolve();

function salvarTemas() {
  try { localStorage.setItem("temas_alunos", JSON.stringify(temasAlunos)); } catch (e) {}
  if (!db) return;
  writeChainTemas = writeChainTemas.then(() => db.doc("config/temas").set({ map: temasAlunos }))
    .catch(err => console.error("Erro ao salvar temas:", err));
}
let writeChainTemas = Promise.resolve();

function carregarLocal() {
  try { const r = localStorage.getItem("temas_alunos"); if (r) temasAlunos = JSON.parse(r); } catch (e) {}
  try { const r = localStorage.getItem("generos_alunos"); if (r) generosAlunos = JSON.parse(r); } catch (e) {}
  ORDEM_DIAS.forEach(dia => {
    try { const r = localStorage.getItem("fila_" + dia); if (r) filas[dia] = JSON.parse(r); } catch (e) {}
    try { const r = localStorage.getItem("extras_" + dia); if (r) extras[dia] = JSON.parse(r); } catch (e) {}
  });
}
function salvarFila(dia) {
  try { localStorage.setItem("fila_" + dia, JSON.stringify(filas[dia])); } catch (e) {}
  if (!db) return;
  const prev = writeChainFila[dia] || Promise.resolve();
  writeChainFila[dia] = prev.then(() => db.doc("filas/" + dia).set({ entries: filas[dia] }))
    .catch(err => console.error("Erro ao salvar fila:", err));
}
function salvarExtras(dia) {
  try { localStorage.setItem("extras_" + dia, JSON.stringify(extras[dia])); } catch (e) {}
  if (!db) return;
  const prev = writeChainExtras[dia] || Promise.resolve();

    .catch(err => console.error("Erro ao salvar alunos adicionados:", err));
}

const carinhaAleatoria = nome => { const p = poolDoTema(temaDoAluno(nome), generoDoNome(nome)); return p[Math.floor(Math.random() * p.length)]; };
const alunosDoDia = dia =>
  DIAS[dia].alunos
    .concat(extras[dia] || [])
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" }));
const estaNaFila = (dia, nome) => filas[dia].some(e => e.nome === nome);

function turmasDoDia(dia) {
  const set = new Set(alunosDoDia(dia).map(a => a.turma || ""));
  return ORDEM_TURMAS.filter(t => set.has(t)).concat([...set].filter(t => !ORDEM_TURMAS.includes(t)));
}

function renderTabs() {

function renderSubtabs(turmas) {
  const el = document.getElementById("subtabs");

function renderAlunos() {
  const turmas = turmasDoDia(diaAtual);
  if (!turmas.includes(turmaAtual[diaAtual])) turmaAtual[diaAtual] = turmas[0];
  renderSubtabs(turmas);
  const wrap = document.getElementById("lista-alunos");
  wrap.innerHTML = "";
  alunosDoDia(diaAtual).filter(a => (a.turma || "") === turmaAtual[diaAtual]).forEach(aluno => {

    chk.checked = estaNaFila(diaAtual, aluno.nome);
    chk.onchange = () => onToggleAluno(aluno.nome, chk.checked);
    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = aluno.nome;

    turma.className = "turma";
    turma.textContent = aluno.turma;
    const sel = document.createElement("select");
    sel.className = "tema";
    sel.title = "Tema do avatar";
    Object.keys(THEMES).forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o); });
    sel.value = temaDoAluno(aluno.nome);
    sel.onchange = () => { temasAlunos[aluno.nome] = sel.value; salvarTemas(); if (estaNaFila(diaAtual, aluno.nome)) trocarAvatar(diaAtual, aluno.nome); };
    // Botão de gênero: ↔️ = Auto (pelo nome), 👧 = menina, 👦 = menino. Cada clique avança: Auto → 👧 → 👦 → Auto
    const btnG = document.createElement("button");
    btnG.type = "button";
    btnG.className = "btn-genero";
    const manual = generosAlunos[aluno.nome] || "";
    const inf = generoInferido(aluno.nome);
    btnG.textContent = manual === "f" ? "👧" : manual === "m" ? "👦" : "↔️";
    btnG.title = manual ? (manual === "f" ? "Menina (manual) — clique para alternar" : "Menino (manual) — clique para alternar")
      : "Auto (detectado pelo nome: " + (inf === "f" ? "menina" : inf === "m" ? "menino" : "desconhecido") + ") — clique para alternar";
    btnG.onclick = () => {
      const prox = manual === "" ? "f" : manual === "f" ? "m" : "";
      if (prox) generosAlunos[aluno.nome] = prox; else delete generosAlunos[aluno.nome];
      salvarGeneros();
      const e = filas[diaAtual].find(x => x.nome === aluno.nome);
      if (e && !poolDoTema(temaDoAluno(aluno.nome), generoDoNome(aluno.nome)).includes(e.carinha)) trocarAvatar(diaAtual, aluno.nome);
      renderAlunos();
    };
    if (mostrarTemas) row.append(chk, nome, btnG, sel, turma); else row.append(chk, nome, turma);
    wrap.appendChild(row);
  });
}

function renderFila() {
  const wrap = document.getElementById("lista-fila");
  wrap.innerHTML = "";
  const itens = filas[diaAtual].map((entry, idx) => ({ entry, idx }));

  const criarLinha = (entry, idx, posTexto, mover) => {
    const row = document.createElement("div");
    row.className = "row fila-row" + (entry.corrigido ? " corrigido" : "");
    const pos = document.createElement("div");
    pos.className = "pos";
    pos.textContent = posTexto;
    const carinha = document.createElement("div");
    carinha.className = "carinha";
    if (girando[diaAtual + "|" + entry.nome]) {
      carinha.classList.add("girando");
      carinha.appendChild(criarEspiral());
    } else {
      montarAvatar(entry.carinha, carinha);
      if (!entry.corrigido) {
        carinha.classList.add("clicavel");
        carinha.title = "Clique para sortear outro avatar";
        carinha.onclick = () => trocarAvatar(diaAtual, entry.nome);
      }
    }
    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = entry.nome;
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = !!entry.corrigido;
    chk.title = "Dever corrigido?";
    chk.onchange = () => onToggleCorrigido(idx, chk.checked);
    if (mover) {
      const setas = document.createElement("div");
      setas.className = "setas";
      const mk = (cls, titulo, pontos, fn) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "seta" + (fn ? "" : " vazia");
        b.title = titulo;
        b.setAttribute("aria-label", titulo);
        b.innerHTML = '<svg viewBox="0 0 12 8" width="10" height="7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="' + pontos + '"/></svg>';
        if (fn) b.onclick = fn;
        return b;
      };
      setas.append(mk("sobe", "Subir na fila", "2,6.5 6,2 10,6.5", mover.sobe), mk("desce", "Descer na fila", "2,1.5 6,6 10,1.5", mover.desce));
      row.append(pos, carinha, nome, setas, chk);
    } else row.append(pos, carinha, nome, chk);
    return row;
  };

  // monta pendentes + separador + corrigidos de uma lista de itens
  const montarLista = (lista, container) => {
    const pendentes = lista.filter(i => !i.entry.corrigido);
    const corrigidos = lista.filter(i => i.entry.corrigido);
    pendentes.forEach((i, n) => container.appendChild(criarLinha(i.entry, i.idx, (n + 1) + "º", {
      sobe: n > 0 ? () => moverNaFila(i.idx, pendentes[n - 1].idx) : null,
      desce: n < pendentes.length - 1 ? () => moverNaFila(i.idx, pendentes[n + 1].idx) : null
    })));
    if (corrigidos.length) {
      const sep = document.createElement("div");
      sep.className = "sep-corrigidos";
      sep.textContent = "CORRIGIDOS";
      container.appendChild(sep);
      corrigidos.forEach(i => container.appendChild(criarLinha(i.entry, i.idx, "✓")));
    }
  };

  // dias sem Tia Vivi: fila única, como antes
  if (!VIVI[diaAtual]) { montarLista(itens, wrap); return; }

  // dia com Tia Vivi: coluna dividida ao meio
  const grid = document.createElement("div");
  grid.className = "fila-dividida";
  [
    { titulo: "Mr. Léo", lista: itens.filter(i => !ehVivi(diaAtual, i.entry.nome)) },
    { titulo: "Tia Vivi", lista: itens.filter(i => ehVivi(diaAtual, i.entry.nome)) }
  ].forEach(c => {
    const col = document.createElement("div");
    col.className = "fila-col";
    const h = document.createElement("h3");
    h.textContent = c.titulo;
    col.appendChild(h);
    if (!c.lista.length) {
      const v = document.createElement("div");
      v.className = "fila-vazia";
      v.textContent = "Fila vazia";
      col.appendChild(v);
    } else montarLista(c.lista, col);
    grid.appendChild(col);
  });
  wrap.appendChild(grid);
}

const girando = {};

function criarEspiral() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 50 50");
  let d = "";
  for (let i = 0; i <= 120; i++) {
    const t = (i / 120) * Math.PI * 6;
    const r = 1.5 + t * 1.2;
    d += (i ? "L" : "M") + (25 + r * Math.cos(t)).toFixed(1) + " " + (25 + r * Math.sin(t)).toFixed(1);
  }
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", d);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "2.6");
  path.setAttribute("stroke-linecap", "round");
  svg.appendChild(path);
  return svg;
}

function novoAvatar(nome, atual) {
  const p = poolDoTema(temaDoAluno(nome), generoDoNome(nome));
  const outros = p.filter(x => x !== atual);
  const lista = outros.length ? outros : p;
  return lista[Math.floor(Math.random() * lista.length)];
}

// Gira a espiral por 1,5s (simulando um sorteio) e então troca o avatar do aluno na fila
function trocarAvatar(dia, nome) {
  const chave = dia + "|" + nome;
  if (girando[chave]) return;
  girando[chave] = true;
  if (dia === diaAtual) renderFila();
  setTimeout(() => {
    delete girando[chave];
    const fila = filas[dia].slice();
    const i = fila.findIndex(e => e.nome === nome);
    if (i !== -1) {
      fila[i] = Object.assign({}, fila[i], { carinha: novoAvatar(nome, fila[i].carinha) });
      filas[dia] = fila;
      salvarFila(dia);
    }
    if (dia === diaAtual) renderFila();
  }, 1500);
}

function moverNaFila(a, b) {
  const fila = filas[diaAtual].slice();
  if (!fila[a] || !fila[b]) return;
  const t = fila[a]; fila[a] = fila[b]; fila[b] = t;
  filas[diaAtual] = fila;
  renderFila();
  salvarFila(diaAtual);
}

function onToggleAluno(nome, marcado) {
  const existe = estaNaFila(diaAtual, nome);
  if (marcado && !existe) {
    const fila = filas[diaAtual].slice();
    const novo = { nome, carinha: carinhaAleatoria(nome), corrigido: false };
    const primeiroCorrigido = fila.findIndex(e => e.corrigido);
    if (primeiroCorrigido === -1) fila.push(novo);
    else fila.splice(primeiroCorrigido, 0, novo);
    filas[diaAtual] = fila;
  } else if (!marcado && existe) {
    filas[diaAtual] = filas[diaAtual].filter(e => e.nome !== nome);
  } else return;
  renderAlunos();
  renderFila();
  salvarFila(diaAtual);
}

function onToggleCorrigido(idx, marcado) {
  const fila = filas[diaAtual].slice();
  if (!fila[idx]) return;
  const entry = Object.assign({}, fila.splice(idx, 1)[0], { corrigido: marcado });
  if (marcado) {
    fila.push(entry);
  } else {
    const primeiroCorrigido = fila.findIndex(e => e.corrigido);
    if (primeiroCorrigido === -1) fila.push(entry);
    else fila.splice(primeiroCorrigido, 0, entry);
  }
  filas[diaAtual] = fila;
  renderFila();
  salvarFila(diaAtual);
}

async function initDb() {
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { carregarLocal(); renderAlunos(); renderFila(); return; }
  db.doc("config/generos").onSnapshot(
    snap => { const d = snap.exists ? snap.data() : null; generosAlunos = (d && d.map) ? d.map : {}; renderAlunos(); },
    err => console.error("Erro nos gêneros:", err)
  );
  db.doc("config/temas").onSnapshot(
    snap => { const d = snap.exists ? snap.data() : null; temasAlunos = (d && d.map) ? d.map : {}; renderAlunos(); },
    err => console.error("Erro nos temas:", err)
  );
  ORDEM_DIAS.forEach(dia => {
    db.doc("filas/" + dia).onSnapshot(
      snap => {
        const data = snap.exists ? snap.data() : null;
        filas[dia] = (data && Array.isArray(data.entries)) ? data.entries : [];
        if (dia === diaAtual) { renderAlunos(); renderFila(); }
      },
      err => console.error("Erro na fila de " + dia + ":", err)
    );
    db.doc("extras/" + dia).onSnapshot(
      snap => {
        const data = snap.exists ? snap.data() : null;
        extras[dia] = (data && Array.isArray(data.alunos)) ? data.alunos : [];
        if (dia === diaAtual) renderAlunos();
      },
      err => console.error("Erro nos alunos extras de " + dia + ":", err)
    );
  });
}

const SENHA_HASH = "f9cae0b0d0280218556b95d7e57a465563690b3cde648bcbcf6b17eed203baad";

// SHA-256 em JS puro (usado quando o navegador/iframe não libera crypto.subtle)
function sha256js(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const mp = Math.pow, mx = mp(2, 32);
  let result = "";
  const words = [];
  const bitLen = ascii.length * 8;
  let hash = [], k = [];
  const comp = {};
  for (let c = 2; k.length < 64; c++) {
    if (!comp[c]) {
      for (let i = 0; i < 313; i += c) comp[i] = c;
      hash[k.length] = (mp(c, .5) * mx) | 0;
      k[k.length] = (mp(c, 1 / 3) * mx) | 0;
    }
  }
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (bitLen / mx) | 0;
  words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const old = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash);
      hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) {
    const b = (hash[i] >> (j * 8)) & 255;
    result += ((b < 16) ? 0 : "") + b.toString(16);
  }
  return result;
}

async function sha256(texto) {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (err) {}
  return sha256js(unescape(encodeURIComponent(texto)));
}

let appIniciado = false;
function iniciarApp() {
  if (appIniciado) return;
  appIniciado = true;
  document.body.classList.remove("bloqueado");
  renderTabs();
  renderAlunos();
  renderFila();
  if (window.claude && typeof window.claude.use === "function") initDb();
  else { carregarLocal(); renderAlunos(); renderFila(); }
}

async function tentarEntrar() {
  const campo = document.getElementById("gate-senha");
  const erro = document.getElementById("gate-erro");
  let ok = false;
  try { ok = (await sha256(campo.value)) === SENHA_HASH; } catch (err) { ok = false; }
  if (ok) {
    try { sessionStorage.setItem("acesso_ok", SENHA_HASH); } catch (err) {}
    iniciarApp();
  } else {
    erro.classList.remove("hidden");
    campo.value = "";
    campo.focus();
  }
}
document.getElementById("gate-form").addEventListener("submit", e => { e.preventDefault(); });
document.getElementById("gate-btn").addEventListener("click", e => { e.preventDefault(); tentarEntrar(); });
document.getElementById("gate-senha").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); tentarEntrar(); }
});

try {
  if (sessionStorage.getItem("acesso_ok") === SENHA_HASH) iniciarApp();
  else document.getElementById("gate-senha").focus();
} catch (err) {}
</script>

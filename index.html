<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Correção - Mr. Léo</title>
<style>
:root {
  --bg:#f4f6fb; --card:#fff; --text:#1f2430; --muted:#6b7280; --border:#e2e5ec;
  --accent:#2f5496; --accent-text:#fff; --chip:#eef1f8; --green:#d9ead3; --green-text:#2e5c1a; --danger:#c0392b;
  --shadow:0 1px 3px rgba(20,24,40,.08),0 1px 2px rgba(20,24,40,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#14161c; --card:#1d2028; --text:#eef0f5; --muted:#9aa0ad; --border:#30333d;
    --accent:#5b82c4; --accent-text:#0d1117; --chip:#262a33; --green:#23361f; --green-text:#b7e2a4; --danger:#e57368;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg:#14161c; --card:#1d2028; --text:#eef0f5; --muted:#9aa0ad; --border:#30333d;
  --accent:#5b82c4; --accent-text:#0d1117; --chip:#262a33; --green:#23361f; --green-text:#b7e2a4; --danger:#e57368;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
header.topo { text-align:center; padding:14px 12px; background:var(--card); border-bottom:1px solid var(--border); }
header.topo h1 { margin:0; font-size:1.35rem; font-weight:800; color:var(--accent); }
.app-shell { display:flex; align-items:stretch; min-height:calc(100dvh - 60px); }
aside.sidebar { flex:0 0 auto; width:108px; padding:12px 8px; background:var(--card); border-right:1px solid var(--border);
  position:sticky; top:0; height:100dvh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
aside.sidebar .titulo { font-size:.7rem; font-weight:700; color:var(--muted); text-align:center; margin-bottom:4px; }
#tabs { display:flex; flex-direction:column; gap:8px; }
.tab { width:100%; padding:10px 6px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.8rem; font-weight:600; cursor:pointer; }
.tab.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
main { flex:1; min-width:0; padding:12px; display:grid; grid-template-columns:1fr; gap:12px; align-content:start; }
@media (min-width:640px) { main { grid-template-columns:1fr 1fr; } }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:10px 12px; }
.card h2 { font-size:.82rem; margin:0 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.subtabs { display:flex; gap:6px; margin:0 0 6px; }
.subtabs.hidden { display:none; }
.subtab { flex:1; padding:7px 6px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.82rem; font-weight:700; cursor:pointer; }
.subtab.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
.row { display:flex; align-items:center; gap:8px; padding:5px 4px; border-radius:8px; font-size:.88rem; }
.row + .row { border-top:1px solid var(--border); }
.row input[type="checkbox"] { width:18px; height:18px; flex:0 0 auto; accent-color:var(--accent); }
.row .nome { font-weight:600; flex:1; }
.row .turma { font-size:.7rem; color:var(--muted); background:var(--chip); padding:1px 7px; border-radius:999px; }
.add-aluno { display:flex; gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
.add-aluno input[type="text"], .add-aluno select { padding:7px 9px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.85rem; }
.add-aluno input[type="text"] { flex:1; min-width:0; }
.add-aluno button { padding:7px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-text); font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap; }
.msg-erro { margin-top:6px; font-size:.8rem; font-weight:600; color:var(--danger); }
.msg-erro.hidden { display:none; }
.fila-row.corrigido { background:var(--green); border-radius:10px; }
.fila-row.corrigido .nome, .fila-row.corrigido .pos, .fila-row.corrigido .carinha { text-decoration:line-through; color:var(--green-text); }
.pos { font-weight:700; min-width:28px; color:var(--muted); }
.carinha { font-size:1.2rem; }
.limpar-wrap { margin-top:14px; text-align:right; }
button.limpar { background:none; border:1px solid var(--danger); color:var(--danger); padding:8px 14px; border-radius:10px; font-size:.85rem; font-weight:600; cursor:pointer; }
.modal-overlay { position:fixed; inset:0; background:rgba(10,12,18,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal-overlay.hidden { display:none; }
.modal { background:var(--card); color:var(--text); border-radius:14px; padding:20px; max-width:340px; width:100%; box-shadow:var(--shadow); }
.modal p { margin:0 0 18px; font-size:.95rem; }
.modal .actions { display:flex; gap:10px; justify-content:flex-end; }
.modal button { padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--chip); color:var(--text); font-weight:600; cursor:pointer; }
.modal button.confirmar { background:var(--danger); border-color:var(--danger); color:#fff; }
  
html { max-width:100%; overflow-x:hidden; }
main > .card { min-width:0; }
.row .nome { min-width:0; overflow-wrap:anywhere; }
.add-aluno { flex-wrap:wrap; }
.add-aluno input[type="text"] { flex:1 1 140px; min-width:0; }
.add-aluno select { flex:0 0 auto; }
header.topo h1 { font-size:clamp(1.05rem, 5vw, 1.35rem); overflow-wrap:anywhere; }
@media (max-width:480px) {
  aside.sidebar { width:84px; padding:10px 6px; }
  .tab { padding:9px 4px; font-size:.72rem; }
  main { padding:8px; gap:8px; }
  .card { padding:8px 10px; }
  .add-aluno input[type="text"] { flex:1 1 100%; }
  .modal { max-width:100%; }
}

</style>
</style>
</head>
<body>
<header class="topo"><h1>Lista de Correção - Mr. Léo</h1></header>
<div class="app-shell">
  <aside class="sidebar">
        <div id="tabs"></div>
  </aside>
  <main>
    <section class="card">
      <h2>Alunos</h2>
      <div id="subtabs" class="subtabs hidden"></div>
      <div id="lista-alunos"></div>
      <div class="add-aluno">
        <input type="text" id="novo-aluno-nome" placeholder="Nome do aluno">
        <select id="novo-aluno-turma">
          <option value="">Turma</option>
          <option value="4º">4º</option>
          <option value="5º">5º</option>
        </select>
        <button id="btn-add-aluno">+ Adicionar</button>
      </div>
      <div id="msg-aluno" class="msg-erro hidden" role="alert"></div>
    </section>
    <section class="card">
      <h2>Fila de Correção</h2>
      <div id="lista-fila"></div>
      <div class="limpar-wrap"><button class="limpar" id="btn-limpar">Limpar Fila</button></div>
    </section>
  </main>
</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <p>Tem certeza que deseja limpar toda a fila? Essa ação não pode ser desfeita.</p>
    <div class="actions">
      <button id="modal-cancelar">Cancelar</button>
      <button class="confirmar" id="modal-confirmar">Limpar</button>
    </div>
  </div>
</div>

<script>
const CARINHAS = ["🤠","🥳","😜","🤗","🤩","🙃","😄","😴","😎","😃","😁","😋","🤪","😌","🤩"];
const mk = (lista, t) => lista.map(n => ({ nome: n, turma: t }));
const DIAS = {
  "SEGUNDA": { label: "SEGUNDA", alunos: mk(["BENTO","BERNARDO","BRUNA","DANIELA","ISABELLE","MARINA","MIGUEL BAUTE","VALENTINA FF","VALENTINA SS"], "4º") },
  "TERÇA": { label: "TERÇA", alunos: mk(["AMANDA","BÁRBARA","BENÍCIO","EVA","JÚLIA","LAURA","LUCAS KALUME","MARIANA","MELISSA","MIGUEL CADIMA","NICOLAS","OLÍVIA","OTHO"], "5º") },
  "QUARTA": { label: "QUARTA", alunos: mk(["BENTO","BERNARDO","BRUNA","DANIELA","FELIPE","ISABELLE","MARINA","MIGUEL LOPES","VALENTINA SS"], "4º") },
  "QUINTA": { label: "QUINTA", alunos: mk(["ANDRÉ","BENTO","LUCAS DE PINA","BERNARDO","MIGUEL LOPES","FELIPE","BRUNA","DANIELA","ISABELLE","VALENTINA SS","VALENTINA FF","CECÍLIA","MARIA JÚLIA","LUNA"], "4º")
    .concat(mk(["BENÍCIO","LUCAS KALUME","NICOLAS","EVA","HEITOR","JÚLIA","MIGUEL CADIMA","AMANDA","MARIANA","OTHO","BÁRBARA","LAURA","MELISSA","OLÍVIA"], "5º")) }
};
const ORDEM_DIAS = Object.keys(DIAS);
const ORDEM_TURMAS = ["4º", "5º", ""];

let diaAtual = ORDEM_DIAS[0];
let filas = {}, extras = {}, turmaAtual = {};
ORDEM_DIAS.forEach(d => { filas[d] = []; extras[d] = []; turmaAtual[d] = null; });
let db = null;
const writeChainFila = {}, writeChainExtras = {};

function carregarLocal() {
  ORDEM_DIAS.forEach(dia => {
    try { const r = localStorage.getItem("fila_" + dia); if (r) filas[dia] = JSON.parse(r); } catch (e) {}
    try { const r = localStorage.getItem("extras_" + dia); if (r) extras[dia] = JSON.parse(r); } catch (e) {}
  });
}
function salvarFila(dia) {
  try { localStorage.setItem("fila_" + dia, JSON.stringify(filas[dia])); } catch (e) {}
  if (!db) return;
  const prev = writeChainFila[dia] || Promise.resolve();
  writeChainFila[dia] = prev.then(() => db.doc("filas/" + dia).set({ entries: filas[dia] }))
    .catch(err => console.error("Erro ao salvar fila:", err));
}
function salvarExtras(dia) {
  try { localStorage.setItem("extras_" + dia, JSON.stringify(extras[dia])); } catch (e) {}
  if (!db) return;
  const prev = writeChainExtras[dia] || Promise.resolve();
  writeChainExtras[dia] = prev.then(() => db.doc("extras/" + dia).set({ alunos: extras[dia] }))
    .catch(err => console.error("Erro ao salvar alunos adicionados:", err));
}

const carinhaAleatoria = () => CARINHAS[Math.floor(Math.random() * CARINHAS.length)];
const alunosDoDia = dia =>
  DIAS[dia].alunos
    .concat(extras[dia] || [])
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" }));
const estaNaFila = (dia, nome) => filas[dia].some(e => e.nome === nome);

function turmasDoDia(dia) {
  const set = new Set(alunosDoDia(dia).map(a => a.turma || ""));
  return ORDEM_TURMAS.filter(t => set.has(t)).concat([...set].filter(t => !ORDEM_TURMAS.includes(t)));
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ORDEM_DIAS.forEach(dia => {
    const btn = document.createElement("button");
    btn.className = "tab" + (dia === diaAtual ? " active" : "");
    btn.textContent = DIAS[dia].label;
    btn.onclick = () => { diaAtual = dia; renderTabs(); renderAlunos(); renderFila(); };
    tabs.appendChild(btn);
  });
}

function renderSubtabs(turmas) {
  const el = document.getElementById("subtabs");
  el.innerHTML = "";
  el.classList.toggle("hidden", turmas.length < 2);
  if (turmas.length < 2) return;
  turmas.forEach(t => {
    const b = document.createElement("button");
    b.className = "subtab" + (t === turmaAtual[diaAtual] ? " active" : "");
    b.textContent = t || "Outros";
    b.onclick = () => { turmaAtual[diaAtual] = t; renderAlunos(); };
    el.appendChild(b);
  });
}

function renderAlunos() {
  const turmas = turmasDoDia(diaAtual);
  if (!turmas.includes(turmaAtual[diaAtual])) turmaAtual[diaAtual] = turmas[0];
  renderSubtabs(turmas);
  const wrap = document.getElementById("lista-alunos");
  wrap.innerHTML = "";
  alunosDoDia(diaAtual).filter(a => (a.turma || "") === turmaAtual[diaAtual]).forEach(aluno => {
    const row = document.createElement("div");
    row.className = "row";
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = estaNaFila(diaAtual, aluno.nome);
    chk.onchange = () => onToggleAluno(aluno.nome, chk.checked);
    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = aluno.nome;
    const turma = document.createElement("div");
    turma.className = "turma";
    turma.textContent = aluno.turma;
    row.append(chk, nome, turma);
    wrap.appendChild(row);
  });
}

function renderFila() {
  const wrap = document.getElementById("lista-fila");
  wrap.innerHTML = "";
  filas[diaAtual].forEach((entry, idx) => {
    const row = document.createElement("div");
    row.className = "row fila-row" + (entry.corrigido ? " corrigido" : "");
    const pos = document.createElement("div");
    pos.className = "pos";
    pos.textContent = (idx + 1) + "º";
    const carinha = document.createElement("div");
    carinha.className = "carinha";
    carinha.textContent = entry.carinha || "";
    const nome = document.createElement("div");
    nome.className = "nome";
    nome.textContent = entry.nome;
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = !!entry.corrigido;
    chk.title = "Dever corrigido?";
    chk.onchange = () => onToggleCorrigido(idx, chk.checked);
    row.append(pos, carinha, nome, chk);
    wrap.appendChild(row);
  });
}

function onToggleAluno(nome, marcado) {
  const existe = estaNaFila(diaAtual, nome);
  if (marcado && !existe) {
    filas[diaAtual] = filas[diaAtual].concat([{ nome, carinha: carinhaAleatoria(), corrigido: false }]);
  } else if (!marcado && existe) {
    filas[diaAtual] = filas[diaAtual].filter(e => e.nome !== nome);
  } else return;
  renderAlunos();
  renderFila();
  salvarFila(diaAtual);
}

function onToggleCorrigido(idx, marcado) {
  const fila = filas[diaAtual].slice();
  if (!fila[idx]) return;
  fila[idx] = Object.assign({}, fila[idx], { corrigido: marcado });
  filas[diaAtual] = fila;
  renderFila();
  salvarFila(diaAtual);
}

document.getElementById("btn-add-aluno").onclick = () => {
  const inputNome = document.getElementById("novo-aluno-nome");
  const inputTurma = document.getElementById("novo-aluno-turma");
  const nome = inputNome.value.trim().toUpperCase();
  const msg = document.getElementById("msg-aluno");
  const erro = t => { msg.textContent = t; msg.classList.remove("hidden"); };
  msg.classList.add("hidden");
  if (!nome) { erro("Digite o nome do aluno."); inputNome.focus(); return; }
  const turma = inputTurma.value;
  if (!turma) { erro("Selecione a turma do aluno."); inputTurma.focus(); return; }
  if (alunosDoDia(diaAtual).some(a => a.nome === nome && a.turma === turma)) {
    erro(nome + " já está na lista do " + turma + " ano.");
    inputNome.focus();
    return;
  }
  extras[diaAtual] = (extras[diaAtual] || []).concat([{ nome, turma }]);
  salvarExtras(diaAtual);
  turmaAtual[diaAtual] = turma;
  inputNome.value = "";
  inputTurma.value = "";
  renderAlunos();
};
document.getElementById("novo-aluno-nome").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btn-add-aluno").click();
});

  function esconderMsgAluno() {
  document.getElementById("msg-aluno").classList.add("hidden");
}

document.addEventListener("click", e => {
  if (e.target.id !== "btn-add-aluno") esconderMsgAluno();
});

document.getElementById("novo-aluno-nome").addEventListener("input", e => {
  if (!e.target.value.trim()) esconderMsgAluno();
});
  
const modal = document.getElementById("modal");
document.getElementById("btn-limpar").onclick = () => modal.classList.remove("hidden");
document.getElementById("modal-cancelar").onclick = () => modal.classList.add("hidden");
document.getElementById("modal-confirmar").onclick = () => {
  filas[diaAtual] = [];
  renderAlunos();
  renderFila();
  salvarFila(diaAtual);
  modal.classList.add("hidden");
};

async function initDb() {
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { carregarLocal(); renderAlunos(); renderFila(); return; }
  ORDEM_DIAS.forEach(dia => {
    db.doc("filas/" + dia).onSnapshot(
      snap => {
        const data = snap.exists ? snap.data() : null;
        filas[dia] = (data && Array.isArray(data.entries)) ? data.entries : [];
        if (dia === diaAtual) { renderAlunos(); renderFila(); }
      },
      err => console.error("Erro na fila de " + dia + ":", err)
    );
    db.doc("extras/" + dia).onSnapshot(
      snap => {
        const data = snap.exists ? snap.data() : null;
        extras[dia] = (data && Array.isArray(data.alunos)) ? data.alunos : [];
        if (dia === diaAtual) renderAlunos();
      },
      err => console.error("Erro nos alunos extras de " + dia + ":", err)
    );
  });
}

renderTabs();
renderAlunos();
renderFila();
if (window.claude && typeof window.claude.use === "function") initDb();
else { carregarLocal(); renderAlunos(); renderFila(); }
</script>
</body>
</html>
